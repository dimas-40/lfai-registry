<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등기 도우미 — 작동 시나리오</title>
<meta name="theme-color" content="#eef0f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../lfai-icons/icon-192.png?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#eef0f3;--ink:#1b2430;--sub:#6a7482;--line:#dfe3e9;--blue:#2b5fd0;--green:#1f9d6b;--amber:#f3b63a;--amberd:#8a6a00}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Pretendard Variable",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:15px}
.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#0b1e17;color:#dcebe3}
.bar .mk{width:22px;height:22px;border-radius:6px;background:#14402e;display:grid;place-items:center;color:#6fd3a4;font-weight:800;font-size:10px}
.bar b{font-size:13px}.bar .st{margin-left:auto;font-size:10px;color:#8fb3a3}
.screen{flex:1;overflow-y:auto;position:relative}
.wrap{padding:13px 14px 180px}
.ghead{display:flex;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px}
.ghead b{color:var(--ink);font-size:13.5px}.ghead .tag{margin-left:auto;font-size:10px;font-weight:800;background:#e6edfb;color:var(--blue);padding:3px 8px;border-radius:999px}
.fld{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:#fff;transition:.25s}
.fld.active{border-color:var(--blue);box-shadow:0 0 0 3px #2b5fd022}
.fld.done{border-color:#bfe3d2;background:#f5fbf8}
.fld .l{font-size:10.5px;color:var(--sub);font-weight:700;display:flex;align-items:center}
.fld .l .ck{margin-left:auto;color:var(--green);opacity:0;transition:.2s}.fld.done .l .ck{opacity:1}
.fld .v{font-size:13px;font-weight:600;margin-top:3px;min-height:18px}.fld .v.ph{color:#b7bfc9;font-weight:400}
.fld .v .cur{display:inline-block;width:2px;height:15px;background:var(--blue);vertical-align:-3px;animation:bk .9s step-end infinite}@keyframes bk{50%{opacity:0}}
/* 턴 독(춤) */
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(13px + env(safe-area-inset-bottom));background:linear-gradient(#ffffff00,#fff 20%)}
.turn{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 8px 28px -12px #0b122133;transition:.25s}
.turn.agent{border-color:#bcd0f5}
.turn.user{border-color:#9fe0c3}
.turn.gate{border-color:#f3d79a;background:#fffdf6}
.who{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:9px}
.who.a{background:#e6edfb;color:var(--blue)}.who.u{background:#e7f7ef;color:var(--green)}.who.g{background:#fdf0d6;color:var(--amberd)}
.who .d{width:7px;height:7px;border-radius:50%;background:currentColor}.who.a .d{animation:pl 1s infinite}
@keyframes pl{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.tmsg{font-size:13px;line-height:1.5;color:var(--ink)}
.tmsg b{color:var(--blue)}
.tbtn{width:100%;margin-top:11px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:14px;color:#fff;background:var(--green);position:relative;overflow:hidden}
.tbtn.gate{background:#2b2f8a}
.tbtn::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 0 #1f9d6b55;animation:ring 1.4s infinite}
.tbtn.gate::after{box-shadow:0 0 0 0 #2b2f8a55;animation:ringb 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #1f9d6b66}70%{box-shadow:0 0 0 12px #1f9d6b00}100%{box-shadow:0 0 0 0 #1f9d6b00}}
@keyframes ringb{0%{box-shadow:0 0 0 0 #2b2f8a66}70%{box-shadow:0 0 0 12px #2b2f8a00}100%{box-shadow:0 0 0 0 #2b2f8a00}}
.tbtn.hidepulse::after{display:none}
/* 턴 리본(에이전트 ⇄ 본인) */
.ribbon{display:flex;align-items:center;justify-content:center;gap:8px;font-size:10.5px;color:var(--sub);margin-bottom:9px}
.ribbon .b{font-weight:800}.ribbon .ag{color:var(--blue)}.ribbon .me{color:var(--green)}
.replay{position:absolute;right:13px;top:11px;z-index:9;background:#0b1e17;color:#cfe3d9;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:11.5px;font-weight:700;display:none;align-items:center;gap:5px}
.replay.on{display:inline-flex}
.done .tmsg{color:var(--green);font-weight:700}
</style>
</head>
<body>
<div class="bar"><span class="mk">등</span><b>등기 도우미</b><span class="st" id="st">에이전트 작업 중</span></div>
<div class="screen" id="screen">
  <button class="replay" id="replay" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4h4"/></svg>다시</button>
  <div class="wrap">
    <div class="ghead"><b>법인 설립 등기 신청</b><span class="tag">startbiz · 전산</span></div>
    <div class="fld" data-k="0"><div class="l">상호<svg class="ck" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="v ph">—</div></div>
    <div class="fld" data-k="1"><div class="l">자본금<svg class="ck" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="v ph">—</div></div>
    <div class="fld" data-k="2"><div class="l">대표이사<svg class="ck" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="v ph">—</div></div>
    <div class="fld" data-k="3"><div class="l">사업목적<svg class="ck" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="v ph">—</div></div>
  </div>
  <!-- 턴 독 -->
  <div class="dock">
    <div class="ribbon"><span class="b ag">에이전트</span><span><svg width="14" height="10" viewBox="0 0 24 16" fill="none" stroke="#6a7482" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M7 3 3 7l4 4"/><path d="M3 7h12"/><path d="M17 13l4-4-4-4"/><path d="M21 9H9"/></svg></span><span class="b me">본인</span><span id="rib">· 번갈아 진행</span></div>
    <div class="turn agent" id="turn">
      <span class="who a" id="who"><span class="d"></span>에이전트</span>
      <div class="tmsg" id="msg">서식을 읽고 전산에 입력하는 중…</div>
      <button class="tbtn hidepulse" id="btn" type="button" style="display:none">다음</button>
    </div>
  </div>
</div>
<script>
(function(){
  var $=function(s){return document.getElementById(s)},reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,
      flds=[].slice.call(document.querySelectorAll(".fld")),VALS=["세움테크 주식회사","50,000,000원","김세움","소프트웨어 개발·공급"],tm=[];
  function clr(){tm.forEach(clearTimeout);tm=[]}
  function wait(ms,f){tm.push(setTimeout(f,reduce?0:ms))}
  function type(el,str,done){var i=0;el.classList.remove("ph");(function t(){if(i<=str.length){el.innerHTML=str.slice(0,i)+'<span class="cur"></span>';i++;tm.push(setTimeout(t,reduce?0:32))}else{el.textContent=str;done&&done()}})();}
  // 에이전트 턴: 필드 채우기
  function agentFill(ks,done){
    $("turn").className="turn agent";$("who").className="who a";$("who").innerHTML='<span class="d"></span>에이전트';
    $("st").textContent="에이전트 작업 중";$("msg").textContent="전산에 입력하는 중…";$("btn").style.display="none";
    var idx=0;(function nx(){ if(idx>=ks.length){done();return;} var k=ks[idx],f=flds[k],el=f.querySelector(".v");
      f.classList.add("active"); type(el,VALS[k],function(){f.classList.remove("active");f.classList.add("done");idx++;wait(250,nx);}); })();
  }
  // 유저 턴: 메시지 + 버튼(펄스) → 자동 "탭"
  function userTurn(cls,whoTxt,whoCls,msg,btnTxt,btnCls,auto,done){
    $("turn").className="turn "+cls;$("who").className="who "+whoCls;$("who").innerHTML='<span class="d"></span>'+whoTxt;
    $("st").textContent="본인 차례";$("msg").innerHTML=msg;
    var b=$("btn");b.style.display="block";b.textContent=btnTxt;b.className="tbtn "+(btnCls||"");
    function go(){ b.className="tbtn "+(btnCls||"")+" hidepulse";b.textContent="✓ "+btnTxt;wait(500,function(){done();}); }
    b.onclick=go;
    if(!reduce&&auto)wait(1700,go);
  }
  function run(){
    clr();flds.forEach(function(f,i){f.classList.remove("active","done");var el=f.querySelector(".v");el.className="v ph";el.textContent="—";});
    $("replay").classList.remove("on");
    // 1) 에이전트: 상호·자본금
    agentFill([0,1],function(){
      // 유저 턴: 확인
      userTurn("user","본인","u","에이전트가 <b>기본정보</b>를 입력했어요. 확인하고 다음?","다음","",true,function(){
        // 2) 에이전트: 대표이사·목적
        agentFill([2,3],function(){
          userTurn("user","본인","u","<b>임원·목적</b>까지 입력 완료. 계속할까요?","계속","",true,function(){
            // 3) 게이트: 전자서명(본인만)
            userTurn("gate","본인 전용","g","<b>전자서명</b>이 필요해요 — 본인만 할 수 있어요.","내가 인증","gate",true,function(){
              // 4) 게이트: 제출(본인)
              userTurn("gate","본인 전용","g","다 됐어요. <b>제출</b>만 남았어요 — 본인이 마무리.","내가 제출","gate",true,function(){
                // 완료
                $("turn").className="turn done";$("who").className="who u";$("who").innerHTML='<span class="d"></span>완료';
                $("st").textContent="완료";$("msg").innerHTML="신청 제출 완료 — 입력은 도구가, 제출은 본인이.";$("btn").style.display="none";
                $("replay").classList.add("on");
              });
            });
          });
        });
      });
    });
  }
  $("replay").onclick=run;
  run();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
