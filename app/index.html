<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등기 도우미 — 작동 시연</title>
<meta name="theme-color" content="#eef0f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../lfai-icons/icon-192.png?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#eef0f3;--ink:#1b2430;--sub:#6a7482;--line:#dfe3e9;--blue:#2b5fd0;--green:#1f9d6b;--amber:#f3b63a;--red:#d2443a;--card:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Pretendard Variable",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:15px;line-height:1.5}
.bar{display:flex;align-items:center;gap:9px;padding:13px 15px;background:#0b1e17;color:#dcebe3;border-bottom:1px solid #16271f}
.bar .mk{width:24px;height:24px;border-radius:7px;background:#14402e;display:grid;place-items:center;color:#6fd3a4;font-weight:800;font-size:11px}
.bar b{font-size:13.5px}
.bar .st{margin-left:auto;font-size:10.5px;color:#8fb3a3;display:flex;align-items:center;gap:5px;white-space:nowrap}
.bar .st i{width:7px;height:7px;border-radius:50%;background:#2fbf7f;animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #2fbf7f88}70%{box-shadow:0 0 0 7px #2fbf7f00}100%{box-shadow:0 0 0 0 #2fbf7f00}}
.screen{flex:1;overflow-y:auto;position:relative}
.wrap{padding:14px 15px 96px}
/* 정부 전산 폼 느낌 */
.ghead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin:4px 0 12px}
.ghead b{color:var(--ink);font-size:14px}
.ghead .tag{margin-left:auto;font-size:10.5px;font-weight:800;background:#e6edfb;color:var(--blue);padding:3px 8px;border-radius:999px}
.fld{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;transition:.25s}
.fld.active{border-color:var(--blue);box-shadow:0 0 0 3px #2b5fd022}
.fld.done{border-color:#bfe3d2;background:#f5fbf8}
.fld .lb{font-size:11px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px}
.fld .lb .ck{margin-left:auto;color:var(--green);opacity:0;transition:.2s}
.fld.done .lb .ck{opacity:1}
.fld .vl{font-size:14.5px;font-weight:600;color:var(--ink);min-height:21px;margin-top:4px}
.fld .vl .cur{display:inline-block;width:2px;height:16px;background:var(--blue);vertical-align:-3px;animation:bk .9s step-end infinite}
@keyframes bk{50%{opacity:0}}
.fld .vl.ph{color:#b7bfc9;font-weight:400}
.prog{display:flex;align-items:center;gap:9px;margin:4px 0 12px;font-size:11.5px;color:var(--sub)}
.prog .track{flex:1;height:6px;border-radius:6px;background:#dfe3e9;overflow:hidden}
.prog .bar2{height:100%;width:0;background:linear-gradient(90deg,#2b5fd0,#2fbf7f);transition:.4s}
/* 하단 단계 레일(삼박자) */
.rail{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffffff00,#fff 24%);padding:14px 15px calc(14px + env(safe-area-inset-bottom))}
.steps{display:flex;gap:6px;margin-bottom:11px}
.steps .s{flex:1;text-align:center;font-size:10px;color:var(--sub);position:relative}
.steps .s .dot{width:22px;height:22px;border-radius:50%;background:#e4e7ee;color:#9aa3ae;display:grid;place-items:center;margin:0 auto 5px;font-weight:800;font-size:11px}
.steps .s.on .dot{background:var(--blue);color:#fff}
.steps .s.on{color:var(--ink);font-weight:700}
.steps .s.hz .dot{background:var(--amber);color:#3a2b00}
.cta{width:100%;border:0;border-radius:13px;padding:15px;font:inherit;font-weight:800;font-size:14.5px;background:#c3c6d4;color:#fff}
.cta.go{background:var(--blue);box-shadow:0 6px 16px #2b5fd044}
.cta.hz{background:#2b2f8a}
.replay{position:absolute;right:14px;bottom:92px;z-index:8;display:inline-flex;align-items:center;gap:5px}
/* 확정 모달 */
.mdim{position:absolute;inset:0;background:#0b1221aa;display:none;align-items:flex-end;z-index:9}
.mdim.on{display:flex;animation:fin .25s}
@keyframes fin{from{opacity:0}}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0005;animation:up .3s}
@keyframes up{from{transform:translateY(40px)}}
.sheet .si{width:44px;height:44px;border-radius:12px;background:#fff4e0;display:grid;place-items:center;margin-bottom:12px}
.sheet h3{font-size:16px}
.sheet p{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
.sheet .gl{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.sheet .gl span{font-size:11px;font-weight:700;background:#fdeceb;color:var(--red);padding:4px 9px;border-radius:999px}
.sheet .fin{width:100%;border:0;border-radius:13px;padding:15px;font:inherit;font-weight:800;font-size:14.5px;background:var(--blue);color:#fff;margin-top:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bar"><span class="mk">등</span><b>등기 도우미</b><span class="st" id="barst"><i></i>자동입력 중</span></div>

<div class="screen" id="screen">
  <button class="cta replay hidden" id="replay" style="width:auto;padding:8px 13px;font-size:12px;background:#0b1e17;color:#cfe3d9;box-shadow:0 4px 14px #0004" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v4h4"/></svg>다시 보기</button>
  <div class="wrap">
    <div class="ghead"><b>법인 설립 등기 신청</b><span class="tag">startbiz · 전산</span></div>
    <div class="prog"><span id="pct">0/5</span><div class="track"><div class="bar2" id="bar2"></div></div></div>

    <div class="fld" data-k="0"><div class="lb">상호<svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="vl ph">자동 입력 대기…</div></div>
    <div class="fld" data-k="1"><div class="lb">본점 소재지<svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="vl ph">—</div></div>
    <div class="fld" data-k="2"><div class="lb">자본금<svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="vl ph">—</div></div>
    <div class="fld" data-k="3"><div class="lb">대표이사<svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="vl ph">—</div></div>
    <div class="fld" data-k="4"><div class="lb">발행주식총수<svg class="ck" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="vl ph">—</div></div>

    <p style="font-size:11px;color:#9aa3ae;margin-top:12px">※ 값은 내 AI가 만든 서식(프로필)에서 자동으로 들어갑니다. 내 폰에만 저장됩니다.</p>
  </div>

  <div class="rail">
    <div class="steps">
      <div class="s" data-s="0"><div class="dot">1</div>서식<br>내 AI</div>
      <div class="s" data-s="1"><div class="dot">2</div>자동입력<br>도구</div>
      <div class="s" data-s="2"><div class="dot">3</div>제출<br>본인</div>
    </div>
    <button class="cta" id="cta" disabled>자동입력 중…</button>
  </div>

  <!-- 확정 단계 — 본인 차례 -->
  <div class="mdim" id="mdim"><div class="sheet">
    <div class="si"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#f3b63a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
    <h3>여기부터는 본인이 직접</h3>
    <p>입력은 끝났습니다. <b>결제·전자서명·제출</b>은 도구가 대신 누르지 않습니다 — 본인 손가락으로 마무리하세요.</p>
    <div class="gl"><span>결제 · 본인</span><span>전자서명 · 본인</span><span>제출 · 본인</span></div>
    <button class="fin" id="fin" type="button">본인 인증하고 제출하기</button>
  </div></div>
</div>

<script>
(function(){
  var $=function(s){return document.getElementById(s)},
      reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,
      VALS=["세움테크 주식회사","서울특별시 중구 세종대로 110","50,000,000원","김세움","10,000주"],
      flds=[].slice.call(document.querySelectorAll(".fld")),
      steps=[].slice.call(document.querySelectorAll(".steps .s")),
      tm=[];
  function clr(){tm.forEach(clearTimeout);tm=[]}
  function stepOn(n){steps.forEach(function(s,i){s.classList.remove("hz");s.classList.toggle("on",i<=n)})}
  function setBar(n){$("bar2").style.width=(n/VALS.length*100)+"%";$("pct").textContent=n+"/"+VALS.length}

  function type(el,str,done){
    var i=0;el.classList.remove("ph");el.innerHTML='<span class="cur"></span>';
    (function t(){
      if(i<=str.length){el.innerHTML=str.slice(0,i)+'<span class="cur"></span>';i++;tm.push(setTimeout(t,reduce?0:34))}
      else{el.textContent=str;done&&done()}
    })();
  }
  function fillField(k){
    if(k>=VALS.length){finishFill();return}
    var f=flds[k],el=f.querySelector(".vl");
    f.classList.add("active");
    type(el,VALS[k],function(){
      f.classList.remove("active");f.classList.add("done");setBar(k+1);
      tm.push(setTimeout(function(){fillField(k+1)},reduce?0:300));
    });
  }
  function finishFill(){
    $("barst").innerHTML='입력 완료';
    $("cta").textContent="확정 단계로";$("cta").disabled=false;$("cta").className="cta go";
    stepOn(1);
    if(!reduce)tm.push(setTimeout(gate,700));
  }
  function gate(){
    stepOn(2);steps[2].classList.add("hz");
    $("cta").textContent="본인 차례 — 결제·서명·제출";$("cta").className="cta hz";$("cta").disabled=true;
    $("mdim").classList.add("on");
  }
  function reset(){
    clr();setBar(0);$("barst").innerHTML='<i></i>자동입력 중';$("mdim").classList.remove("on");
    flds.forEach(function(f,i){f.classList.remove("active","done");var el=f.querySelector(".vl");el.className="vl ph";el.textContent=i?"—":"자동 입력 대기…"});
    stepOn(0);$("cta").className="cta";$("cta").disabled=true;$("cta").textContent="자동입력 중…";
    $("screen").scrollTop=0;$("replay").classList.remove("hidden");
  }
  $("cta").addEventListener("click",function(){if(!$("cta").disabled&&$("cta").classList.contains("go"))gate()});
  $("fin").addEventListener("click",function(){
    $("mdim").classList.remove("on");$("barst").innerHTML='제출 준비 완료';
    $("cta").className="cta go";$("cta").disabled=false;$("cta").textContent="본인 인증으로 진행";
  });
  $("replay").addEventListener("click",function(){reset();start()});
  function start(){clr();reset();if(reduce){VALS.forEach(function(v,i){var el=flds[i].querySelector(".vl");el.className="vl";el.textContent=v;flds[i].classList.add("done")});setBar(VALS.length);finishFill();}else tm.push(setTimeout(function(){fillField(0)},800))}
  start();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
